url: https://steenharsted.github.io/paindrawR/
template:
  bootstrap: 5
  bootswatch: flatly

reference:
- title: "Importing"
  desc: "Functions for importing data into paindrawR"
  contents: 
  - pdr_import_json
  - pdr_import_png
  - pdr_mird2pdr

- title: "Plotting"
  desc: "Functions for Plotting data."
  contents:
  - contains("plot")

- title: "Image quantification"
  contents:
  - pdr_summarize_rgba

- title: "paindrawR data modification"
  contents:
  - pdr_add_rgba
  - pdr_explode
  - pdr_implode_xy
  - pdr_modify_xy
  - pdr_modify_rgba

- title: "Stencils"
  desc: "Premade stencils to aid in image analysis"
  contents:
  - contains("stencil")

- title: "Example data"
  desc: "Example data and files"
  contents:
  - contains("example")

- title: "Helper functions"
  contents:
  - pdr_match
  - pdr_get_info

